plugins { id 'com.android.application' }
// Signing secrets are read only from an external private properties file or environment.
def signingFile = System.getenv('CAMPUS_SIGNING_PROPERTIES')
def signingValues = new Properties()
if (signingFile) { new File(signingFile).withInputStream { signingValues.load(it) } }
def signingValue = { String key -> signingValues.getProperty(key) ?: System.getenv('CAMPUS_' + key.toUpperCase()) }
def hasSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { signingValue(it) }
android {
    namespace 'cn.qvtu.campuslite'
    compileSdk 34
    defaultConfig {
        applicationId 'cn.qvtu.campuslite'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.3.1'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (hasSigning) {
            official {
                storeFile file(signingValue('storeFile'))
                storePassword signingValue('storePassword')
                keyAlias signingValue('keyAlias')
                keyPassword signingValue('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // No JavascriptInterface or reflection-based custom API; no broad keep rules.
            if (hasSigning) signingConfig signingConfigs.official
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
